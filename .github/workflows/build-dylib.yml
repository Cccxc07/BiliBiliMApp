name: Build dylib

# Build libBiliBiliMDDylib.dylib in the cloud, download it from Actions Artifacts,
# then hand it to TrollFools / TrollStore injector.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'BiliBiliMDDylib/**'
      - 'BiliBiliMD.xcodeproj/**'
      - '.github/workflows/build-dylib.yml'

jobs:
  build:
    name: build libBiliBiliMDDylib.dylib
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          sw_vers

      - name: Install MonkeyDev
        run: |
          set -e
          git clone --depth 1 https://github.com/AloneMonkey/MonkeyDev.git /tmp/MonkeyDev
          sudo mkdir -p /opt/MonkeyDev/Frameworks /opt/MonkeyDev/include /opt/MonkeyDev/Librarys /opt/MonkeyDev/bin /opt/MonkeyDev/Tools
          sudo cp -R /tmp/MonkeyDev/include/. /opt/MonkeyDev/include/ || true
          sudo cp -R /tmp/MonkeyDev/Librarys/. /opt/MonkeyDev/Librarys/ || true
          sudo cp -R /tmp/MonkeyDev/Frameworks/. /opt/MonkeyDev/Frameworks/ || true
          sudo cp -R /tmp/MonkeyDev/bin/. /opt/MonkeyDev/bin/ || true
          sudo cp -R /tmp/MonkeyDev/Tools/. /opt/MonkeyDev/Tools/ || true
          echo "--- include ---"
          ls -R /opt/MonkeyDev/include | head -20

      - name: Prepare MonkeyDev / Theos shims
        # 1) theos Prefix.pch is hard-imported by BiliBiliMDDylib-Prefix.pch
        # 2) two files still import the legacy <objc/objc-runtime.h>
        # 3) BiliBiliMDDylib.m imports <Cycript/Cycript.h> unconditionally
        # 4) the repo compiles pre-generated .mm, so MonkeyDev's `md --xcbp-logos` is a no-op
        run: |
          set -e
          sudo mkdir -p /opt/theos /opt/theos/include/objc /opt/MonkeyDev/include/objc /opt/MonkeyDev/include/Cycript

          printf '#ifndef THEOS_PREFIX_PCH\n#define THEOS_PREFIX_PCH\n#import <Foundation/Foundation.h>\n#import <UIKit/UIKit.h>\n#endif\n' | sudo tee /opt/theos/Prefix.pch >/dev/null

          printf '#pragma once\n#include <objc/runtime.h>\n' | sudo tee /opt/theos/include/objc/objc-runtime.h >/dev/null
          sudo cp /opt/theos/include/objc/objc-runtime.h /opt/MonkeyDev/include/objc/objc-runtime.h

          printf '#pragma once\n#ifdef __cplusplus\nextern "C" {\n#endif\nvoid CYListenServer(int port);\n#ifdef __cplusplus\n}\n#endif\n' | sudo tee /opt/MonkeyDev/include/Cycript/Cycript.h >/dev/null

          printf '#!/bin/sh\nexit 0\n' | sudo tee /opt/MonkeyDev/bin/md >/dev/null
          sudo chmod +x /opt/MonkeyDev/bin/md

          echo "--- shims ready ---"
          ls -la /opt/MonkeyDev/include /opt/MonkeyDev/include/objc /opt/MonkeyDev/include/Cycript /opt/theos

      - name: Pipeline audit
        run: node tools/audit-logos-pipeline.js

      - name: Build dylib
        run: |
          set -e
          xcodebuild \
            -project BiliBiliMD.xcodeproj \
            -target BiliBiliMDDylib \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MonkeyDevPath=/opt/MonkeyDev \
            MonkeyDevTheosPath=/opt/theos \
            OTHER_LDFLAGS='-undefined dynamic_lookup' \
            build

      - name: Collect artifact
        run: |
          set -e
          DYLIB="$(find build -name 'libBiliBiliMDDylib.dylib' -print -quit)"
          if [ -z "$DYLIB" ]; then
            echo "::error::libBiliBiliMDDylib.dylib not found"
            find build -maxdepth 3 -type d | head -50
            exit 1
          fi
          mkdir -p out
          cp "$DYLIB" out/
          lipo -info out/libBiliBiliMDDylib.dylib
          otool -L out/libBiliBiliMDDylib.dylib | head -20
          du -h out/libBiliBiliMDDylib.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: libBiliBiliMDDylib
          path: out/libBiliBiliMDDylib.dylib
          if-no-files-found: error
