name: Build dylib

# 浜戠鎶?dylib 缂栧嚭鏉ワ紝浜х墿鍦?Actions 鐨?Artifacts 閲屼笅杞斤紝鐩存帴涓㈢粰 TrollFools 娉ㄥ叆銆?on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'BiliBiliMDDylib/**'
      - 'BiliBiliMD.xcodeproj/**'
      - '.github/workflows/build-dylib.yml'

jobs:
  build:
    name: 缂栬瘧 libBiliBiliMDDylib.dylib
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 鏄剧ず Xcode 鐗堟湰
        run: xcodebuild -version

      - name: 瀹夎 MonkeyDev
        run: |
          set -e
          git clone --depth 1 https://github.com/AloneMonkey/MonkeyDev.git /tmp/MonkeyDev
          cd /tmp/MonkeyDev
          if [ -f install.sh ]; then
            sudo ./install.sh
          elif [ -f bin/install.sh ]; then
            sudo ./bin/install.sh
          else
            echo "::warning::娌℃壘鍒?MonkeyDev 瀹夎鑴氭湰锛屾墜宸ラ摵涓€娆＄洰褰曠粨鏋?
            sudo mkdir -p /opt/MonkeyDev/Frameworks /opt/MonkeyDev/include /opt/MonkeyDev/Librarys
            sudo cp -R /tmp/MonkeyDev/Frameworks/* /opt/MonkeyDev/Frameworks/ 2>/dev/null || true
          fi
          ls -la /opt/MonkeyDev || true

      - name: 绠＄嚎鑷
        run: node tools/audit-logos-pipeline.js

      - name: 缂栬瘧 dylib
        run: |
          set -e
          xcodebuild \
            -project BiliBiliMD.xcodeproj \
            -target BiliBiliMDDylib \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MonkeyDevPath=/opt/MonkeyDev \
            MonkeyDevTheosPath=/opt/theos \
            build

      - name: 鏀堕泦浜х墿
        run: |
          set -e
          DYLIB="$(find build -name 'libBiliBiliMDDylib.dylib' -print -quit)"
          if [ -z "$DYLIB" ]; then
            echo "::error::娌℃湁鎵惧埌 libBiliBiliMDDylib.dylib"
            find build -maxdepth 3 -type d | head -50
            exit 1
          fi
          mkdir -p out
          cp "$DYLIB" out/
          lipo -info out/libBiliBiliMDDylib.dylib
          du -h out/libBiliBiliMDDylib.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: libBiliBiliMDDylib
          path: out/libBiliBiliMDDylib.dylib
          if-no-files-found: error
