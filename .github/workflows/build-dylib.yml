name: Build dylib

# Build libBiliBiliMDDylib.dylib in the cloud, download it from Actions Artifacts,
# then hand it to TrollFools / TrollStore injector.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'BiliBiliMDDylib/**'
      - 'BiliBiliMD.xcodeproj/**'
      - '.github/workflows/build-dylib.yml'

jobs:
  build:
    name: build libBiliBiliMDDylib.dylib
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          sw_vers

      - name: Install MonkeyDev
        run: |
          set -e
          git clone --depth 1 https://github.com/AloneMonkey/MonkeyDev.git /tmp/MonkeyDev
          cd /tmp/MonkeyDev
          if [ -f install.sh ]; then
            sudo ./install.sh
          elif [ -f bin/install.sh ]; then
            sudo ./bin/install.sh
          else
            echo "::warning::no install script found, laying out /opt/MonkeyDev manually"
            sudo mkdir -p /opt/MonkeyDev/Frameworks /opt/MonkeyDev/include /opt/MonkeyDev/Librarys
            sudo cp -R /tmp/MonkeyDev/Frameworks/. /opt/MonkeyDev/Frameworks/ 2>/dev/null || true
            sudo cp -R /tmp/MonkeyDev/include/. /opt/MonkeyDev/include/ 2>/dev/null || true
            sudo cp -R /tmp/MonkeyDev/Librarys/. /opt/MonkeyDev/Librarys/ 2>/dev/null || true
          fi
          ls -la /opt/MonkeyDev
          ls /opt/MonkeyDev/Frameworks | head -30

      - name: Pipeline audit
        run: node tools/audit-logos-pipeline.js

      - name: Build dylib
        run: |
          set -e
          xcodebuild \
            -project BiliBiliMD.xcodeproj \
            -target BiliBiliMDDylib \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MonkeyDevPath=/opt/MonkeyDev \
            MonkeyDevTheosPath=/opt/theos \
            build

      - name: Collect artifact
        run: |
          set -e
          DYLIB="$(find build -name 'libBiliBiliMDDylib.dylib' -print -quit)"
          if [ -z "$DYLIB" ]; then
            echo "::error::libBiliBiliMDDylib.dylib not found"
            find build -maxdepth 3 -type d | head -50
            exit 1
          fi
          mkdir -p out
          cp "$DYLIB" out/
          lipo -info out/libBiliBiliMDDylib.dylib
          du -h out/libBiliBiliMDDylib.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: libBiliBiliMDDylib
          path: out/libBiliBiliMDDylib.dylib
          if-no-files-found: error
